packages:
  - apps/*
  - packages/*

catalog:
  '@types/better-sqlite3': ^9.6.0
  '@types/node': ^24
  better-sqlite3: ^13.0.3
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  expo-background-task: ~57.0.21
  expo-crypto: ~57.0.4
  expo-file-system: ~57.0.7
  expo-network: ~57.0.2
  expo-secure-store: ~57.0.4
  expo-sqlite: ~57.0.4
  expo-task-manager: ~57.0.21
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: ^3.25.76

catalogMode: prefer

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
